<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14191C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kharcha" />
  <title>Kharcha Update</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #14191C; }
    /* Safety net: even if some future element is wider than the screen, the page can
       never be panned sideways or stretched. (clip, unlike hidden, keeps sticky working.) */
    html, body { overflow-x: clip; overscroll-behavior-x: none; }
    /* Stop iOS inflating text when the phone is rotated. */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #root { min-height: 100vh; }
    .boot {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #9BA3A0; font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
    }
  </style>

  <!--
    Libraries are loaded straight from a CDN (esm.sh) using the import map below.
    No build step, no tooling. Babel (loaded further down) turns the JSX in
    app.jsx into plain JavaScript in the browser.
  -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.436.0?external=react",
      "firebase/app": "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"><div class="boot">Loading Kharcha Update&hellip;</div></div>

  <!-- Babel: compiles the JSX in app.jsx on the fly -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>

  <!-- Offline support + "add to home screen" behaviour -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
